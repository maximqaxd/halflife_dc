// Optional Preset A overlay. Execute after preset_a.cfg on a dual-stick pad.
joydualstick 1
joyadvanced 1
joyadvaxisx 3
joyadvaxisy 1
joyadvancedupdate

bind "RSTICK_LEFT" "+left"
bind "RSTICK_RIGHT" "+right"
bind "RSTICK_UP" "+lookdown"
bind "RSTICK_DOWN" "+lookup"

bind "JOY4" "+jump"
bind "JOY3" "impulse 100"
bind "JOY1" "tduck"
bind "JOY2" "+use"

bind "AUX4" "+reload"
bind "AUX1" "invprev"
bind "AUX2" "invnext"
bind "AUX3" "+speed"

bind "S1JOY1" ""
bind "S1JOY2" ""
bind "S1JOY3" ""
bind "S1JOY4" ""
